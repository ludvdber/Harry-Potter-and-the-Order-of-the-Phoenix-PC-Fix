;
;  Two DLLs read this file:
;
;    d3d9.dll           Accio Launcher's fix (mouse, keyboard, image).
;                       Reads [Accio.Window], [Accio.Graphics], and the two
;                       shared sections [MAIN] and [FORCEWINDOWED].
;    d3d9_original.dll  the game-specific wrapper this fix is chained to.
;                       Reads [MAIN], [FORCEWINDOWED] and [RESOLUTION].
;
;  [MAIN] and [FORCEWINDOWED] mean the same thing to both DLLs.
;
;  1 = on, 0 = off.
; ============================================================================


; ----------------------------------------------------------------------------
;  Window and focus - read by both DLLs
; ----------------------------------------------------------------------------
[MAIN]
; Borderless window instead of exclusive full screen. Needed for everything
; else here: without it, Alt+Tab freezes the game.
ForceWindowedMode = 1
; Frame cap (0 = none).
FPSLimit = 0
FPSLimitMode = 2

[FORCEWINDOWED]
; Keeps the game running when it loses focus (Alt+Tab, a click on another
; monitor) instead of freezing. Keyboard and mouse are taken back as soon
; as the game returns to the front.
DoNotNotifyOnTaskSwitch = 1
; 1 = borderless full screen, 2 = window, 3 = resizable window.
ForceWindowStyle = 1
CenterWindow = 1
UsePrimaryMonitor = 0
AlwaysOnTop = 0


; ----------------------------------------------------------------------------
;  Accio Launcher fix - mouse and keyboard
; ----------------------------------------------------------------------------
[Accio.Window]

; Lets the mouse leave the game window: move to another monitor, Alt+Tab.
; Without it the cursor stays trapped on the main screen.
FreeMouse=1

; 1 makes the game ignore Windows display scaling: without it, at 125 % and
; more, the window is drawn smaller then stretched (blurry).
DPIAware=1

; Screenshot key, as a Windows virtual-key code (123 = F12, 44 = PrtScr,
; 0 = none). Pictures go to the game folder, in "screenshots".
ScreenshotKey=123

; Frame rate and frame time in the corner of the screen.
DisplayFPSCounter=0


; ----------------------------------------------------------------------------
;  Accio Launcher fix - image (values checked on this game)
; ----------------------------------------------------------------------------
[Accio.Graphics]

; Edge smoothing (FXAA) with light sharpening. Required by every effect below.
FXAA=1
Sharpness=0.40

; Multisample anti-aliasing: 0, 2, 4, 8 or 16.
Antialiasing=16

; Texture sharpness at an angle: 0, 2, 4, 8 or 16.
AnisotropicFiltering=16

; Negative = sharper distant textures, 0 = as shipped.
TextureLODBias=-1.5

; Render at 2x, 3x or 4x the resolution, then scale down. Very demanding.
SSAAFactor=1

; Sharper shadows (1, 2 or 4). Experimental.
ShadowMapScale=1

VSync=1

; Colour adjustments.
ColorGrading=1
Vibrance=0.45
Vignette=0.08
Lift=0.00
Gamma=1.00
Gain=1.08
Temperature=0.04
Tint=0.04
Contrast=0.30
SplitTone=0.18

; Glow around bright areas, and light shafts from the brightest source.
Bloom=1
BloomStrength=0.35
BloomThreshold=0.75
GodRays=1
GodRaysStrength=0.45
GodRaysDecay=0.96

; Ambient occlusion: soft shadows where surfaces meet.
SSAO=1
SSAOStrength=0.55
SSAORadius=6.0
SSAOMinDelta=0.02
SSAOMaxDelta=0.15

; Size of the rendered image. 0 = the size chosen in the game's options
; (recommended: a different size can make characters show a faint duplicate).
RenderWidth=0
RenderHeight=0


; ============================================================================
;  Lower wrapper (d3d9_original.dll) - game-specific patches
; ============================================================================

; Window size, and the resolution patched into the game.
[RESOLUTION]
Width = 1920
Height = 1080
